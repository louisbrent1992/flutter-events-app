org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:+UseStringDeduplication -XX:+OptimizeStringConcat
android.useAndroidX=true
android.enableJetifier=true

# Performance optimizations
# Tuned for an 8 GB host: parallel execution spawns concurrent worker JVMs that
# push total commit past physical RAM and force pagefile thrashing.
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2
org.gradle.unsafe.configuration-cache=false

# Kotlin optimizations
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m
kotlin.incremental=true
kotlin.incremental.android=true
kotlin.code.style=official
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
